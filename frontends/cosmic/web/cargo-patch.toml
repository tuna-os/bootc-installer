# Cargo patch overrides for the browser-only COSMIC build (#105).
#
# Only .github/workflows/wasm-cosmic.yml reads this file, through
# `cargo --config web/cargo-patch.toml`. Cargo.toml, Cargo.lock, the
# Flatpak cargo sources and the shipped native build do not use it.
#
# Every source is a tuna-os fork at a full commit SHA on a branch of that
# fork, merged by pull request. shared/browser/wasm-patches/CARRIED.md has
# the fork, the commit and the reason of each pin, and how to rebase.
# - tuna-os/libcosmic `master`: patch 02 (cosmic-config `system_path`).
# - tuna-os/rust-atomicwrites `master`: patch 01 (a fallback `imp`).
# - tuna-os/iced `cosmic-wasm/5fc4372`: patches 06 and 03 on the iced
#   commit that the libcosmic pin has as its submodule. libcosmic carries
#   iced as a git submodule, so the lockfile names each iced crate with
#   the libcosmic source, and nothing depends on an iced git URL. The iced
#   crates are patched under both libcosmic sources: the patched libcosmic
#   refers to its own source. Patch all of them or none: two copies of
#   iced_core do not link.
#
# Renovate bumps each rev to the head of its branch (renovate.json,
# customManagers), and does not automerge it.
# tests/unit/test_wasm_cosmic.py checks the format.

[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { git = "https://github.com/tuna-os/libcosmic", rev = "f59dea696d6c15568f936286db081e778c264a57" }
