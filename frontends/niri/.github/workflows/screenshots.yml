name: screenshots

# Renders ui/installer.qml headlessly and publishes the walkthrough.
#
# Beyond docs, this is the only way anyone can LOOK at this UI without a Wayland
# compositor. It normally runs under Quickshell on niri, which is why the
# installer had effectively never been seen — and why a screen that was 93%
# white on a near-black theme went unnoticed.

on:
  push:
    branches: [main]
    paths: ["ui/**", "tests/**", ".github/workflows/screenshots.yml"]
  pull_request:
    paths: ["ui/**", "tests/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Qt's offscreen platform plugin still links these even though it never
      # opens a display.
      - name: install Qt runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 imagemagick
          pip install --quiet PyQt6

      - name: capture every screen
        run: python3 tests/gui/capture-screens.py docs/screenshots

      # Also carries walkthrough-niri.json — the parity report tunaOS's
      # installer matrix consumes (docs/INSTALLER-FRONTENDS.md). It is written
      # into the same directory, so it needs no separate upload.
      - uses: actions/upload-artifact@v7
        # always(): the capture fails when a screen renders wrong, which is
        # exactly when the picture is needed.
        if: always()
        with:
          name: gui-screenshots
          path: docs/screenshots/

      - name: commit refreshed screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "docs: refresh GUI screenshots [skip ci]"
          git push
