name: screenshots

# Regenerates docs/screenshots/*.png and the README walkthrough from the real
# GTK3 wizard. Two things this buys beyond nicer docs:
#
#  1. Design review on a PR. A clipped label or a page that renders empty is
#     invisible in a diff and obvious in an image. The artifact is downloadable
#     from every PR that touches the app.
#  2. A gate that actually launches the app. The first run of this capture found
#     that the installer crashed on startup — refresh_nav() read self.index
#     while the pages were still being constructed, so the window never opened.
#     Nothing else in CI started the GUI, so nothing else could have caught it.

on:
  push:
    branches: [main]
    paths: ["tuna_installer_xfce/**", "tests/gui/**", ".github/workflows/screenshots.yml"]
  pull_request:
    paths: ["tuna_installer_xfce/**", "tests/gui/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # python3-gi-cairo is not optional: without it every custom draw handler
      # fails with "Couldn't find foreign struct converter for 'cairo.Context'"
      # and the TrawlLine progress indicator silently does not render — the
      # screenshots come out looking fine but missing a widget.
      - name: install GTK3 + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            xvfb imagemagick

      - name: capture every screen
        run: xvfb-run -a python3 tests/gui/capture-screens.py docs/screenshots

      # Also carries walkthrough-xfce.json — the parity report tunaOS's
      # installer matrix consumes (docs/INSTALLER-FRONTENDS.md). It is written
      # into the same directory, so it needs no separate upload.
      - uses: actions/upload-artifact@v7
        # always(): the capture FAILS when a screen renders wrong, which is
        # exactly when someone needs to look at the picture. Skipping the upload
        # on failure leaves a capture bug diagnosable only from ratios.
        if: always()
        with:
          name: gui-screenshots
          path: docs/screenshots/

      # Only main commits. On a PR the artifact is the deliverable: pushing
      # generated images into a contributor's branch rewrites history for files
      # they did not touch.
      - name: commit refreshed screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "no screenshot changes"
            exit 0
          fi
          # [skip ci] stops this commit triggering another run of itself.
          git commit -m "docs: refresh GUI screenshots [skip ci]"
          git push
