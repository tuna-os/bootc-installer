name: Publish Flatpak

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2). This file just keeps this repo's own
# trigger policy and the pinned runtime image.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@main
    with:
      app-id: org.tunaos.InstallerKde
      manifest-path: flatpak/org.tunaos.InstallerKde.json
      repo-name: tuna-os/tuna-installer-kde
      # aarch64 joins x86_64 because tunaOS's live-ISO build installs this
      # Flatpak from the tuna-os remote, and on arm64 there was nothing to
      # install: the arm64 ISO leg failed with
      #   error: Nothing matches org.tunaos.InstallerKde in remote tuna-os
      # while the amd64 leg of the same nightly passed (tunaOS run
      # 33848074014). Verified end to end on tuna-installer-cosmic first
      # (its run 33953011236): both arches build, publish, and land in the
      # index, which is already per-architecture.
      archs: '["x86_64", "aarch64"]'
      flatpak-builder-image: kde-6.9
    secrets: inherit
