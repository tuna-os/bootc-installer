name: Incident Postmortem
description: Postmortem document for analyzing and documenting resolved operational incidents
title: "[Postmortem]: "
labels: ["postmortem"]
body:
  - type: markdown
    attributes:
      value: |
        Document root cause analysis, timeline, and action items following an operational incident.
  - type: textarea
    id: overview
    attributes:
      label: Incident Overview & Impact
      description: Brief summary of the incident, duration, and user impact.
    validations:
      required: true
  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Sequence of events leading to detection, mitigation, and resolution.
    validations:
      required: true
  - type: textarea
    id: root_cause
    attributes:
      label: Root Cause Analysis
      description: Detailed technical explanation of what caused the issue.
    validations:
      required: true
  - type: textarea
    id: action_items
    attributes:
      label: Action Items & Preventive Measures
      description: List of tasks, runbook updates, or code changes to prevent recurrence.
    validations:
      required: true
