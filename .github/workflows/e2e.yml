name: End to end

# The gate that proves the installers WORK, not just render. Two layers:
#
#  1. One job per frontend drives the shipped wizard from Welcome to Done
#     through its real backend launch path. fisherman at /usr/local/bin is
#     shared/e2e/fisherman-shim.sh: the REAL fisherman built from the
#     submodule validates the recipe the frontend wrote (the same
#     Validate() an install runs first), then streams the nine step lines
#     so the progress parsing and done transition run against the real
#     protocol. The recipe is kept and judged again by check-recipe.py
#     against the shared schema and the disk the job set up.
#
#  2. The recipes those five frontends produced are then installed FOR REAL
#     by fisherman onto a loop disk, and the result is booted in QEMU and
#     verified over SSH, with the same scripts fisherman's own bootcrew VM
#     matrix uses. Only `disk` and `image` are rewritten (the loop device;
#     the ssh-enabled canary matching the recipe's boot stack).
#
# Every job here is listed in promote.yml's REQUIRED_CHECKS, so nothing
# reaches prod without all five frontends having installed something that
# booted. No path filter on purpose: a required check must exist on every
# dev commit.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gnome:
    name: E2E (gnome)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: fisherman/fisherman/go.mod
          cache-dependency-path: fisherman/fisherman/go.sum
      - name: install GTK4 + build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91 \
            blueprint-compiler meson ninja-build libglib2.0-dev desktop-file-utils appstream gettext \
            xvfb python3-jsonschema
      - name: build GResources
        run: |
          meson setup build -Dbuild-fisherman=false --prefix=/tmp/tuna-install
          ninja -C build
      - name: prepare the backend, shim and loop disk
        run: bash shared/e2e/setup.sh
      - name: drive the installer from Welcome to Done
        env:
          GTK_A11Y: none
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a -s "-screen 0 1400x1000x24" python3 tests/e2e/run_gnome.py
      - name: judge the recipe the frontend handed to fisherman
        run: python3 shared/e2e/check-recipe.py gnome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-recipe-gnome
          path: e2e-recipe-gnome.json
          if-no-files-found: error

  xfce:
    name: E2E (xfce)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontends/xfce
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: fisherman/fisherman/go.mod
          cache-dependency-path: fisherman/fisherman/go.sum
      - name: install GTK3 + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb python3-jsonschema
      - name: prepare the backend, shim and loop disk
        run: bash ../../shared/e2e/setup.sh
      - name: drive the installer from Welcome to Done
        env:
          GTK_A11Y: none
        run: xvfb-run -a python3 tests/e2e/run.py
      - name: judge the recipe the frontend handed to fisherman
        run: python3 ../../shared/e2e/check-recipe.py xfce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-recipe-xfce
          path: frontends/xfce/e2e-recipe-xfce.json
          if-no-files-found: error

  niri:
    name: E2E (niri)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontends/niri
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: fisherman/fisherman/go.mod
          cache-dependency-path: fisherman/fisherman/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Qt runtime deps + PyQt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
          pip install --quiet PyQt6 jsonschema
      - name: build the Niri backend
        working-directory: frontends/niri/installer
        run: go build -o tuna-installer-niri .
      - name: prepare the backend, shim and loop disk
        run: bash ../../shared/e2e/setup.sh
      - name: recipe from the QML, through the backend, into fisherman
        run: python3 tests/e2e/run.py
      - name: judge the recipe the frontend handed to fisherman
        run: python3 ../../shared/e2e/check-recipe.py niri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-recipe-niri
          path: frontends/niri/e2e-recipe-niri.json
          if-no-files-found: error

  cosmic:
    name: E2E (cosmic)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontends/cosmic
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: fisherman/fisherman/go.mod
          cache-dependency-path: fisherman/fisherman/go.sum
      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config cmake clang \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev \
            libinput-dev libudev-dev libgbm-dev libegl1-mesa-dev libssl-dev \
            python3-jsonschema
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontends/cosmic
      - name: prepare the backend, shim and loop disk
        run: bash ../../shared/e2e/setup.sh
      - name: the Install button's code path, into fisherman
        run: cargo test --release -- --ignored e2e_install_path_reaches_fisherman --nocapture
      - name: judge the recipe the frontend handed to fisherman
        run: python3 ../../shared/e2e/check-recipe.py cosmic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-recipe-cosmic
          path: frontends/cosmic/e2e-recipe-cosmic.json
          if-no-files-found: error

  kde:
    name: E2E (kde)
    runs-on: ubuntu-24.04
    container: quay.io/fedora/fedora:45
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontends/kde
    steps:
      - name: install Qt6 + KF6 + Go
        working-directory: /
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git tar findutils which sudo golang python3 python3-jsonschema \
            cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg \
            kf6-kirigami kf6-kirigami-addons kf6-qqc2-desktop-style kf6-breeze-icons
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build installer + end-to-end driver
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_E2E=ON
          cmake --build build -j"$(nproc)"
      - name: prepare the backend, shim and loop disk
        # The container is root: sudo here just runs the command, which
        # is what fishermanCommand()'s `sudo /usr/local/bin/fisherman` needs.
        run: bash ../../shared/e2e/setup.sh
      - name: the Install button's code path, into fisherman
        env:
          XDG_RUNTIME_DIR: /tmp/runtime
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export TUNA_E2E_DISK="$(cat /tmp/tuna-e2e/loopdev)"
          ./build/tuna-installer-e2e
      - name: judge the recipe the frontend handed to fisherman
        run: python3 ../../shared/e2e/check-recipe.py kde
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-recipe-kde
          path: frontends/kde/e2e-recipe-kde.json
          if-no-files-found: error

  install:
    name: E2E (install ${{ matrix.frontend }})
    needs: [gnome, kde, cosmic, niri, xfce]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        frontend: [gnome, kde, cosmic, niri, xfce]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Multi-GB OCI image + a loop disk: same trick fisherman's own VM job uses.
      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: fisherman/fisherman/go.mod
          cache-dependency-path: fisherman/fisherman/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: e2e-recipe-${{ matrix.frontend }}
          path: recipes
      - name: install the VM tooling fisherman's matrix uses
        working-directory: fisherman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq just socat attr   # attr: setfattr labels the injected SSH files
          just ci-install-tools
      - name: log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login -u "${{ github.actor }}" --password-stdin ghcr.io
      - name: install the frontend's recipe for real and boot it
        env:
          RECIPE: recipes/e2e-recipe-${{ matrix.frontend }}.json
          FRONTEND: ${{ matrix.frontend }}
        run: bash shared/e2e/vm-install.sh "$RECIPE" "$FRONTEND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-install-${{ matrix.frontend }}
          path: /tmp/tuna-e2e-vm/
          if-no-files-found: ignore
