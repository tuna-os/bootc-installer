name: Screenshots (xfce)

# Regenerates frontends/xfce/docs/screenshots from the real GTK3 wizard. It is
# also the only automated gate that launches this app: the first run found the
# installer crashed on startup, and nothing else in CI could have.
#
# Moved here from tuna-os/tuna-installer-xfce's screenshots.yml when that repo
# became frontends/xfce; the body is unchanged apart from paths.

on:
  push:
    branches: [dev]
    paths:
      - "frontends/xfce/tuna_installer_xfce/**"
      - "frontends/xfce/tests/gui/**"
      - "shared/walkthrough/**"
      - ".github/workflows/screenshots-xfce.yml"
  pull_request:
    paths:
      - "frontends/xfce/tuna_installer_xfce/**"
      - "frontends/xfce/tests/gui/**"
      - "shared/walkthrough/**"
      - ".github/workflows/screenshots-xfce.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-xfce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Screenshots (xfce)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontends/xfce
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # python3-gi-cairo is not optional: without it every custom draw handler
      # fails and the TrawlLine progress indicator silently does not render.
      - name: install GTK3 + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            xvfb imagemagick

      - name: run unit tests
        run: |
          sudo apt-get install -y -qq python3-pytest
          python3 -m pytest tests/ -q -p no:cacheprovider --ignore=tests/gui

      - name: capture every screen
        run: xvfb-run -a python3 tests/gui/capture-screens.py docs/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-xfce
          path: frontends/xfce/docs/screenshots/

      - name: commit refreshed screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "no screenshot changes"; exit 0; fi
          git commit -m "docs(xfce): refresh GUI screenshots [skip ci]"
          # Five capture jobs and the walkthrough all push small commits to dev
          # within seconds of each other, and a plain push loses the race with
          # a non-fast-forward rejection (runs 35281231391/462/400 on the
          # first dev push after the monorepo merge). Rebase onto whatever
          # landed meanwhile and retry; these commits never touch the same
          # files, so the rebase is always clean.
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin dev
            git rebase -q origin/dev || { git rebase --abort; echo "::error::rebase onto dev failed"; exit 1; }
            if git push origin HEAD:dev; then exit 0; fi
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 6 attempts"
          exit 1
