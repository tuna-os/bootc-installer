name: Screenshots (xfce)

# Regenerates frontends/xfce/docs/screenshots from the real GTK3 wizard. It is
# also the only automated gate that launches this app: the first run found the
# installer crashed on startup, and nothing else in CI could have.
#
# Moved here from tuna-os/tuna-installer-xfce's screenshots.yml when that repo
# became frontends/xfce; the body is unchanged apart from paths.

on:
  push:
    branches: [dev]
    paths:
      - "frontends/xfce/tuna_installer_xfce/**"
      - "frontends/xfce/tests/**"
      - "frontends/xfce/po/**"
      - "frontends/xfce/flatpak/**"
      - "shared/**"
      - ".github/actions/push-to-dev/**"
      - ".github/workflows/screenshots-xfce.yml"
  pull_request:
    paths:
      - "frontends/xfce/tuna_installer_xfce/**"
      - "frontends/xfce/tests/**"
      - "frontends/xfce/po/**"
      - "frontends/xfce/flatpak/**"
      - "shared/**"
      - ".github/actions/push-to-dev/**"
      - ".github/workflows/screenshots-xfce.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-xfce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Screenshots (xfce)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontends/xfce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # python3-gi-cairo is not optional: without it every custom draw handler
      # fails and the TrawlLine progress indicator silently does not render.
      - name: install GTK3 + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            xvfb imagemagick gettext

      # Under Xvfb because the suite now builds real GTK3 widgets
      # (tests/test_recovery_key.py). GTK3 aborts the process outright when
      # it cannot reach a display -- "Can't create a GtkStyleContext without
      # a display connection" -- so without this the whole run dies rather
      # than failing one test. test_gtk_is_really_initialised asserts the
      # display is there, so removing xvfb-run fails loudly instead of
      # quietly skipping the widget tests.
      - name: run unit tests
        run: |
          sudo apt-get install -y -qq python3-pytest
          xvfb-run -a python3 -m pytest tests/ -q -p no:cacheprovider --ignore=tests/gui

      - name: capture every screen
        run: xvfb-run -a python3 tests/gui/capture-screens.py docs/screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gui-screenshots-xfce
          path: frontends/xfce/docs/screenshots/

      - name: commit refreshed screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: ./.github/actions/push-to-dev
        with:
          working-directory: frontends/xfce
          paths: docs/screenshots
          message: "docs(xfce): refresh GUI screenshots [skip ci]"
          ssh-key: ${{ secrets.DEV_PUSH_DEPLOY_KEY }}
