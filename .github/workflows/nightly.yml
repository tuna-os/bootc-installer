name: CI Tests

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 0'   # 06:00 UTC weekly (Sunday)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-tests:
    strategy:
      fail-fast: false
      matrix:
        branch: [prod, dev]
    name: "Go Tests (${{ matrix.branch }})"
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: fisherman/fisherman

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: fisherman/fisherman/go.sum

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -count=1 -timeout=60s ./...

      - name: Run tests with race detector
        run: go test -race -count=1 -timeout=60s ./...

  python-unit:
    strategy:
      fail-fast: false
      matrix:
        branch: [prod, dev]
    name: "Python Unit Tests (${{ matrix.branch }})"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - run: pytest tests/unit/ -v --tb=short

  python-ui:
    strategy:
      fail-fast: false
      matrix:
        branch: [prod, dev]
    name: "Python UI Tests (${{ matrix.branch }})"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pytest \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-vte-3.91 \
            blueprint-compiler \
            meson \
            ninja-build \
            libglib2.0-dev \
            desktop-file-utils \
            appstream \
            gettext \
            xvfb

      - name: Build GResources
        run: |
          meson setup build \
            -Dbuild-fisherman=false \
            --prefix=/tmp/tuna-install
          ninja -C build
          RESOURCE=$(find build -name "bootc-installer.gresource" | head -1)
          echo "TUNA_RESOURCE=${RESOURCE}" >> $GITHUB_ENV

      - name: Run UI integration tests (Xvfb)
        env:
          GTK_A11Y: none
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a python3 -m pytest tests/ui/ -v --tb=short -p no:cacheprovider

  python-integration:
    strategy:
      fail-fast: false
      matrix:
        branch: [prod, dev]
    name: "Python Integration Tests (${{ matrix.branch }})"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            blueprint-compiler \
            meson \
            ninja-build \
            libglib2.0-dev \
            desktop-file-utils \
            gettext \
            xvfb

      - name: Build GResources
        run: |
          meson setup build \
            -Dbuild-fisherman=false \
            --prefix=/tmp/tuna-install
          ninja -C build
          RESOURCE=$(find build -name "bootc-installer.gresource" | head -1)
          echo "TUNA_RESOURCE=${RESOURCE}" >> $GITHUB_ENV

      - name: Run integration tests
        env:
          GTK_A11Y: none
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a python3 -m pytest tests/integration/ -v --tb=short -p no:cacheprovider

  # The weekly sweep is the one run of these suites against `prod` outside
  # the promote/release gate, and nobody is looking at a schedule run. On a
  # PR the red check is the signal; here a red run used to show only in the
  # Actions tab (#231). Same pattern as published-freshness.yml: it opens, or
  # updates, ONE issue labelled `nightly-failure` while the sweep is red and
  # closes it once a sweep is green again. Add any new job to `needs`.
  report-schedule-failure:
    name: Report weekly sweep
    if: always() && github.event_name == 'schedule'
    needs: [go-tests, python-unit, python-ui, python-integration]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Weekly CI Tests sweep is failing
      ISSUE_LABEL: nightly-failure
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GO_TESTS: ${{ needs.go-tests.result }}
      PYTHON_UNIT: ${{ needs.python-unit.result }}
      PYTHON_UI: ${{ needs.python-ui.result }}
      PYTHON_INTEGRATION: ${{ needs.python-integration.result }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          set -euo pipefail
          failed=false
          for result in "$GO_TESTS" "$PYTHON_UNIT" "$PYTHON_UI" "$PYTHON_INTEGRATION"; do
            case "$result" in
              success|skipped) ;;
              *) failed=true ;;
            esac
          done
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ISSUE_LABEL" \
                     --json number,title --limit 100 \
                   | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ "$failed" = "false" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "The weekly sweep of prod and dev is green again ($RUN_URL). Closing."
              echo "closed #$number"
            fi
            exit 0
          fi
          {
            echo "Opened by \`nightly.yml\`'s weekly schedule run. It rewrites this body"
            echo "on every failing run and closes the issue once the sweep is green"
            echo "again. Each job runs against both \`prod\` and \`dev\`; the run shows"
            echo "which branch failed. Latest run: $RUN_URL"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| go-tests | $GO_TESTS |"
            echo "| python-unit | $PYTHON_UNIT |"
            echo "| python-ui | $PYTHON_UI |"
            echo "| python-integration | $PYTHON_INTEGRATION |"
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
            echo "updated #$number"
          else
            gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 \
              --description "nightly.yml's weekly sweep of prod and dev failed" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" --body-file "$RUNNER_TEMP/issue.md"
          fi
