name: Walkthrough (kde)

# The real kde installer against the mock daemon, picture by picture. See
# _walkthrough.yml and tools/walkthrough/README.md.

on:
  push:
    branches: [dev]
    paths:
      - "frontends/kde/**"
      - "!frontends/kde/docs/**"
      - "tools/walkthrough/**"
      - "shared/flow/screens.yaml"
      - ".github/workflows/_walkthrough.yml"
      - ".github/workflows/walkthrough-kde.yml"
  pull_request:
    paths:
      - "frontends/kde/**"
      - "!frontends/kde/docs/**"
      - "tools/walkthrough/**"
      - "shared/flow/screens.yaml"
      - ".github/workflows/_walkthrough.yml"
      - ".github/workflows/walkthrough-kde.yml"
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walkthrough-kde-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    uses: ./.github/workflows/_walkthrough.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      frontend: kde
    secrets:
      DEV_PUSH_DEPLOY_KEY: ${{ secrets.DEV_PUSH_DEPLOY_KEY }}
