name: Flatpak

on:
  push:
    branches: [prod, dev]
    tags: ["v*"]
  pull_request:
    branches: [prod, dev]
  merge_group:

jobs:
  production:
    name: Build (production)
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.bootcinstaller.Installer.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.json
          cache-key: flatpak-builder-production-${{ github.sha }}

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: org.bootcinstaller.Installer.flatpak
          path: org.bootcinstaller.Installer.flatpak
          retention-days: 30

      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=x86_64 repo bootc-installer.oci org.bootcinstaller.Installer

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootc-installer-oci
          path: bootc-installer.oci/
          retention-days: 1

      - name: Attach bundle to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: tagged-org.bootcinstaller.Installer.flatpak
          path: org.bootcinstaller.Installer.flatpak
          retention-days: 1

  devel:
    name: Build (devel)
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.bootcinstaller.Installer.Devel.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.Devel.json
          cache-key: flatpak-builder-devel-${{ github.sha }}

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: org.bootcinstaller.Installer.Devel.flatpak
          path: org.bootcinstaller.Installer.Devel.flatpak
          retention-days: 30

      - name: Delete existing latest-dev release (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          gh release delete latest-dev --yes --cleanup-tag 2>&1 || true
          git push origin :refs/tags/latest-dev 2>&1 || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish dev pre-release (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if gh release create latest-dev \
              --title "Dev Build" \
              --prerelease \
              --notes "Latest build from the \`dev\` branch. May be unstable." \
              org.bootcinstaller.Installer.Devel.flatpak 2>/dev/null; then
            echo "Release created"
          else
            gh release view latest-dev --json assets --jq '.assets[].name' | \
              xargs -I{} gh release delete-asset latest-dev {} --yes 2>/dev/null || true
            gh release upload latest-dev org.bootcinstaller.Installer.Devel.flatpak --clobber
            echo "Release assets updated"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload devel bundle for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: tagged-org.bootcinstaller.Installer.Devel.flatpak
          path: org.bootcinstaller.Installer.Devel.flatpak
          retention-days: 1

  publish-tagged-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [production, devel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: tagged-org.bootcinstaller.Installer.flatpak

      - name: Download devel bundle
        uses: actions/download-artifact@v4
        with:
          name: tagged-org.bootcinstaller.Installer.Devel.flatpak

      - name: Create and publish release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "bootc-installer ${{ github.ref_name }}" \
              --notes "Release ${{ github.ref_name }}" \
              org.bootcinstaller.Installer.flatpak \
              org.bootcinstaller.Installer.Devel.flatpak; then
            echo "Release already exists — uploading assets to existing release"
            gh release upload ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --clobber \
              org.bootcinstaller.Installer.flatpak \
              org.bootcinstaller.Installer.Devel.flatpak
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish-oci:
    name: Publish OCI to tunaos.org remote
    if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/')
    needs: [production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bootc-installer-oci
          path: bootc-installer.oci

      - name: Push OCI to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy oci:bootc-installer.oci docker://ghcr.io/tuna-os/bootc-installer:latest
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            skopeo copy oci:bootc-installer.oci docker://ghcr.io/tuna-os/bootc-installer:${{ github.ref_name }}
          fi

      - name: Update central index (tuna-os/docs)
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.FLATPAK_INDEX_TOKEN }}@github.com/tuna-os/docs.git \
            index-repo
          pip install requests
          python3 .github/scripts/update-index.py \
            --oci-dir bootc-installer.oci \
            --index-file index-repo/static/flatpak/index/static \
            --repo-name tuna-os/bootc-installer \
            --tags latest
          cd index-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore(flatpak): update bootc-installer OCI index"
            git push origin main
          fi
