name: Flatpak

# Builds the GNOME frontend's Flatpak bundles (production x86_64, production
# aarch64, devel) and keeps them as run artifacts. On a push to `dev` it also
# refreshes the `latest-dev` PRE-release. It never cuts a real release: that
# is release.yml's job, which calls this workflow (workflow_call) on `prod`
# after promote.yml has validated the commit. See docs/RELEASE.md.
#
# History, so nobody puts it back: this workflow used to cut a non-prerelease
# `--latest` release on EVERY push to dev, gated on nothing but "the bundle
# built". runbooks/auto-release-rollback.md exists because of what that shipped.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production:
    name: Build (production)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.bootcinstaller.Installer.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.json
          cache-key: flatpak-builder-production-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: org.bootcinstaller.Installer.flatpak
          path: org.bootcinstaller.Installer.flatpak
          retention-days: 30

  # A separate job rather than a matrix leg, deliberately: a bundle carries
  # refs for one architecture, and release.yml treats this one as optional so
  # an aarch64 breakage cannot block an x86_64 release.
  #
  # `arch: aarch64` is REQUIRED: the action's default is the literal x86_64,
  # not the runner's architecture, and omitting it installs the x86_64 SDK on
  # an arm64 runner (bwrap: Exec format error).
  production-aarch64:
    name: Build (production, aarch64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          arch: aarch64
          bundle: org.bootcinstaller.Installer-aarch64.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.json
          cache-key: flatpak-builder-production-aarch64-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: org.bootcinstaller.Installer-aarch64.flatpak
          path: org.bootcinstaller.Installer-aarch64.flatpak
          retention-days: 30

  devel:
    name: Build (devel)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.bootcinstaller.Installer.Devel.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.Devel.json
          cache-key: flatpak-builder-devel-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: org.bootcinstaller.Installer.Devel.flatpak
          path: org.bootcinstaller.Installer.Devel.flatpak
          retention-days: 30

      # NEVER delete this release or its tag. Once a release has existed on a
      # tag, an immutable-release ruleset bans that tag name from re-creation
      # for good (projectbluefin/bootc-installer#201 took the dev channel down
      # that way). Create-if-missing, then clobber the asset. No deletes.
      - name: Publish dev pre-release (dev branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! gh release view latest-dev >/dev/null 2>&1; then
            gh release create latest-dev \
              --title "Dev Build" \
              --prerelease \
              --notes "Latest build from the \`dev\` branch. Not yet promoted to \`prod\`; may be unstable."
          fi
          gh release upload latest-dev \
            org.bootcinstaller.Installer.Devel.flatpak --clobber
        env:
          GH_TOKEN: ${{ github.token }}
