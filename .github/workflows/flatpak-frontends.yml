name: Flatpak (frontends)

# Build-only validation of the four imported frontends' Flatpaks on pull
# requests and dev pushes. Nothing is published here: the reusable workflow
# runs with publish=false, so a manifest that no longer builds fails the PR
# instead of failing the promotion (or, as before the monorepo, failing on the
# old repos' `main` after the merge, on a branch nobody was looking at).
#
# Each frontend builds only when its own tree changed, on x86_64 only. A
# change to the publish path that all of them share (publish-flatpak.yml,
# publish-oci.yml, shared/ci/frontends.json), to the shared modules
# (shared/flatpak/) or to the fisherman gitlink builds all four. The full
# two-arch publish happens in release.yml.

on:
  pull_request:
  push:
    branches: [dev]
  merge_group:
  workflow_dispatch:

# A called reusable workflow may only narrow the permissions its caller
# passes, never widen them, and publish-flatpak.yml declares
# contents/packages write for its publishing path. Granting less here is a
# startup failure of the whole workflow (run 35254136098), not a skipped
# publish. The build-only path never uses the write scopes.
permissions:
  contents: write
  packages: write

concurrency:
  group: flatpak-frontends-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed frontends
    runs-on: ubuntu-24.04
    outputs:
      kde: ${{ steps.filter.outputs.kde }}
      cosmic: ${{ steps.filter.outputs.cosmic }}
      niri: ${{ steps.filter.outputs.niri }}
      xfce: ${{ steps.filter.outputs.xfce }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            changed=$(git diff --name-only "${HEAD}~1" "$HEAD" 2>/dev/null || git ls-files)
          else
            changed=$(git diff --name-only "$BASE" "$HEAD")
          fi
          # Every frontend builds the data files in shared/account, branding
          # and recipe. XFCE also ships the shared Python package and the
          # dry-run transcript (shared/python/bootc_shared/_data.py, FILES).
          # Every frontend builds the go and fisherman modules in
          # shared/flatpak/ and fisherman from the submodule, so a change to
          # either, or a move of the gitlink (the path `fisherman`), builds
          # all four.
          xfce_shared='shared/python/|shared/progress/dry-run-transcript\.ndjson|'
          for n in kde cosmic niri xfce; do
            extra=""
            [ "$n" = xfce ] && extra="$xfce_shared"
            if echo "$changed" | grep -qE "^(${extra}frontends/$n/|shared/(account|branding|recipe|flatpak)/|fisherman$|shared/ci/frontends\.json|shared/ci/frontend_table\.py|\.github/workflows/(flatpak-frontends|publish-flatpak|publish-oci)\.yml)"; then
              echo "$n=true" >> "$GITHUB_OUTPUT"
            else
              echo "$n=false" >> "$GITHUB_OUTPUT"
            fi
          done
          cat "$GITHUB_OUTPUT"

  kde:
    needs: changes
    if: needs.changes.outputs.kde == 'true'
    uses: ./.github/workflows/publish-flatpak.yml
    with:
      frontend: kde
      publish: false
      archs: '["x86_64"]'
    secrets: inherit

  cosmic:
    needs: changes
    if: needs.changes.outputs.cosmic == 'true'
    uses: ./.github/workflows/publish-flatpak.yml
    with:
      frontend: cosmic
      publish: false
      archs: '["x86_64"]'
    secrets: inherit

  niri:
    needs: changes
    if: needs.changes.outputs.niri == 'true'
    uses: ./.github/workflows/publish-flatpak.yml
    with:
      frontend: niri
      publish: false
      archs: '["x86_64"]'
    secrets: inherit

  xfce:
    needs: changes
    if: needs.changes.outputs.xfce == 'true'
    uses: ./.github/workflows/publish-flatpak.yml
    with:
      frontend: xfce
      publish: false
      archs: '["x86_64"]'
    secrets: inherit
