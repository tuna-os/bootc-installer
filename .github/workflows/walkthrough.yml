name: Walkthrough

# Folds the five frontends' capture output into one document,
# docs/walkthrough/README.md: a parity matrix (which contract screens each
# frontend reaches) and every frontend's screen-by-screen walkthrough, side
# by side. That is the artifact the monorepo exists to make possible: one
# page where drift between the installers is visible instead of inferred.
#
# Runs after any screenshot workflow completes on dev, and weekly as a
# catch-up. It uploads the page as an artifact and commits nothing: pictures
# reach dev only through a pull request (tools/walkthrough/README.md). It does not capture anything itself: it downloads the most recent
# successful gui-screenshots-<frontend> artifact for each frontend from dev,
# so a frontend whose capture is red keeps its last green walkthrough and the
# matrix says so.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the job runs only for same-repo push or dispatch runs, see its if
    workflows:
      - Screenshots (gnome)
      - Screenshots (kde)
      - Screenshots (cosmic)
      - Screenshots (niri)
      - Screenshots (xfce)
    types: [completed]
    branches: [dev]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: walkthrough
  cancel-in-progress: true

jobs:
  aggregate:
    name: Aggregate walkthroughs
    runs-on: ubuntu-24.04
    # A fork pull request from a branch named dev also matches branches: [dev].
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: dev

      - name: Fetch the latest green capture of every frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p captures
          for n in gnome kde cosmic niri xfce; do
            wf="screenshots-$n.yml"
            # Only push and workflow_dispatch runs. A fork pull request from a
            # branch named dev also has head branch dev, but its event is
            # pull_request, so its captures are never committed to dev.
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch dev \
                       --status success --limit 50 --json databaseId,event \
                       --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty' || true)
            if [ -z "$run_id" ]; then
              echo "::warning::no successful $wf run on dev yet; $n will read as pending"
              continue
            fi
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                 --name "gui-screenshots-$n" --dir "captures/$n"; then
              echo "$n: run $run_id"
              echo "$run_id" > "captures/$n/.run-id"
            else
              echo "::warning::run $run_id has no gui-screenshots-$n artifact"
            fi
          done
          ls -R captures | head -80

      # --strict: a strict report whose required evidence is missing is a
      # failure (#186). The page is still built and uploaded first, so it
      # shows the gap; the last step then fails the job.
      - name: Build docs/walkthrough
        id: build
        run: |
          set +e
          python3 shared/walkthrough/aggregate.py captures docs/walkthrough \
            --repo "$GITHUB_REPOSITORY" --strict
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          head -60 docs/walkthrough/README.md

      # The Prose check (ste.yml) counts the page against .ste-budget when a
      # person commits it, and that budget is exact. So the page must add no
      # finding at all. aggregate.py keeps captured UI text in table cells,
      # which are not prose; this step proves it with the same linter, at
      # the commit that ste.yml pins. A failure stops the upload.
      - name: Check that the page adds no STE finding
        run: |
          set -euo pipefail
          sha=$(grep -oE 'ste-lint\.yml@[0-9a-f]{40}' .github/workflows/ste.yml | head -n1 | cut -d@ -f2)
          test -n "$sha"
          mkdir -p "$RUNNER_TEMP/ste-lint"
          for f in ste-lint.mjs ste-rules.mjs; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ste-lint/$f" \
              "https://raw.githubusercontent.com/tuna-os/.github/$sha/.github/actions/ste-lint/$f"
          done
          if ! node "$RUNNER_TEMP/ste-lint/ste-lint.mjs" --max 0 docs/walkthrough/README.md; then
            echo "::error::docs/walkthrough/README.md has STE findings. Its prose is the fixed text in shared/walkthrough/aggregate.py: fix it there, not in .ste-budget."
            exit 1
          fi

      # The publication allowlist (#270): only images, JSON and Markdown,
      # and no recipe secret or E2E test credential. A failure stops the
      # upload.
      - name: Audit what the artifact publishes
        run: python3 shared/e2e/publish.py audit docs/walkthrough

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: walkthrough
          path: docs/walkthrough/

      - name: Fail on a strict walkthrough failure
        if: steps.build.outputs.rc != '0'
        run: |
          echo "::error::a required screen has no evidence; see the failures in the Build step and docs/walkthrough/README.md"
          exit 1
