name: Screenshots (niri)

# Renders frontends/niri/ui/installer.qml headlessly and publishes the
# walkthrough. Beyond docs, this is the only way anyone can LOOK at this UI
# without a Wayland compositor: it normally runs under Quickshell on niri.
#
# Moved here from tuna-os/tuna-installer-niri's screenshots.yml when that repo
# became frontends/niri; the body is unchanged apart from paths.

on:
  push:
    branches: [dev]
    paths:
      - "frontends/niri/ui/**"
      - "frontends/niri/tests/**"
      - "shared/**"
      - ".github/actions/push-to-dev/**"
      - ".github/workflows/screenshots-niri.yml"
  pull_request:
    paths:
      - "frontends/niri/ui/**"
      - "frontends/niri/tests/**"
      - "shared/**"
      - ".github/actions/push-to-dev/**"
      - ".github/workflows/screenshots-niri.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-niri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Screenshots (niri)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontends/niri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Qt's offscreen platform plugin still links these even though it never
      # opens a display.
      - name: install Qt runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 imagemagick
          pip install --quiet PyQt6

      # ui/progress.js against shared/progress/fraction-cases.json, the
      # bar positions every frontend's parser must reproduce.
      - name: progress bar matches the shared fraction cases
        run: node tests/progress-fraction-test.mjs

      - name: capture every screen
        run: python3 tests/gui/capture-screens.py docs/screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gui-screenshots-niri
          path: frontends/niri/docs/screenshots/

      - name: commit refreshed screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: ./.github/actions/push-to-dev
        with:
          working-directory: frontends/niri
          paths: docs/screenshots
          message: "docs(niri): refresh GUI screenshots [skip ci]"
          ssh-key: ${{ secrets.DEV_PUSH_DEPLOY_KEY }}
