name: Publish Flatpak

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build x86_64
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/org.bootcinstaller.Installer.json
          cache-key: flatpak-builder-${{ github.sha }}-x86_64
          build-bundle: false
          upload-artifact: false

      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=x86_64 repo bootc-installer.oci org.bootcinstaller.Installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootc-installer-oci
          path: bootc-installer.oci/
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bootc-installer-oci
          path: bootc-installer.oci

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy oci:bootc-installer.oci docker://ghcr.io/tuna-os/bootc-installer:latest

      - name: Update central index (tuna-os/docs)
        uses: tuna-os/.github/.github/actions/publish-flatpak-index@main
        with:
          oci-dir: bootc-installer.oci
          repo-name: tuna-os/bootc-installer
          tags: latest
          token: ${{ secrets.FLATPAK_INDEX_TOKEN }}
