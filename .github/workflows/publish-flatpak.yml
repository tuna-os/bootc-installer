name: Publish Flatpak (gnome)

# Publishes the GNOME frontend (org.bootcinstaller.Installer) to the tuna-os
# flatpak remote through the shared reusable workflow in tuna-os/.github.
#
# Since the promote/release flow (docs/RELEASE.md) this runs only when
# release.yml calls it after `prod` has been promoted, plus a manual dispatch
# escape hatch. It used to run on every push to `dev`, which meant every
# unvalidated commit went straight to the remote every live ISO installs from.

on:
  workflow_call:
    inputs:
      publish:
        description: Push to GHCR and the central index (false = build-only validation)
        required: false
        type: boolean
        default: true
      archs:
        required: false
        type: string
        default: '["x86_64", "aarch64"]'
    secrets:
      FLATPAK_INDEX_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GHCR and the central index (false = build-only validation)
        required: false
        type: boolean
        default: true
      archs:
        required: false
        type: string
        default: '["x86_64", "aarch64"]'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@main
    with:
      app-id: org.bootcinstaller.Installer
      manifest-path: flatpak/org.bootcinstaller.Installer.json
      repo-name: tuna-os/bootc-installer
      # aarch64 alongside x86_64: the tunaOS live-ISO build installs this
      # Flatpak from the tuna-os remote on both architectures, and the
      # manifest's `go` module already carries both toolchains.
      archs: ${{ inputs.archs }}
      checkout-submodules: true
      publish: ${{ inputs.publish }}
    secrets: inherit
