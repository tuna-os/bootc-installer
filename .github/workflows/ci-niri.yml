name: CI (niri backend)

# Go compile + vet + test for frontends/niri/installer. Nothing else gates
# that module: publish-flatpak-niri only runs on promotion, and
# screenshots-niri drives the QML UI.
#
# Moved here from tuna-os/tuna-installer-niri's ci.yml.

on:
  push:
    branches: [dev]
    paths:
      - "shared/branding/**"
      - "frontends/niri/installer/**"
      - ".github/workflows/ci-niri.yml"
  pull_request:
    paths:
      - "shared/branding/**"
      - "frontends/niri/installer/**"
      - ".github/workflows/ci-niri.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-niri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend (niri)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontends/niri/installer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: frontends/niri/installer/go.mod
          # No go.sum: the backend is standard-library only.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
