name: Cargo Tests (cosmic)

# Runs the COSMIC crate's unit suite.
#
# Until this job existed nothing ran `cargo test` for frontends/cosmic, so the
# suite drifted: recipe_roundtrip_and_field_serialization failed on dev while
# every COSMIC job stayed green (#120). screenshots-cosmic.yml compiles the
# crate, which is why a build break is caught, but compiling is not testing.
#
# The job also builds the mock installer daemon (`fishermand --mock`, from
# tuna-os/fisherman at a pinned commit) and sets FISHERMAND_BIN, so the
# mock_ and flow_ tests drive the daemon path. Without the variable those
# tests print SKIPPED and pass, which is not a test of that path. The pin
# is not the submodule's commit: the daemon is newer than the fisherman
# that the recipe path ships.
#
# The render dependencies (Xvfb, lavapipe, an icon theme) are deliberately
# absent: these tests do not open a window. The e2e test that does is
# #[ignore]d and runs from e2e.yml instead.

on:
  push:
    branches: [prod, dev]
    paths:
      - "frontends/cosmic/src/**"
      - "frontends/cosmic/Cargo.toml"
      - "frontends/cosmic/Cargo.lock"
      - "frontends/cosmic/i18n/**"
      - "frontends/cosmic/flatpak/org.tunaos.InstallerCosmic.json"
      - "shared/**"
      - ".github/workflows/cargo-test-cosmic.yml"
  pull_request:
    paths:
      - "frontends/cosmic/src/**"
      - "frontends/cosmic/Cargo.toml"
      - "frontends/cosmic/Cargo.lock"
      - "frontends/cosmic/i18n/**"
      - "frontends/cosmic/flatpak/org.tunaos.InstallerCosmic.json"
      - "shared/**"
      - ".github/workflows/cargo-test-cosmic.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-test-cosmic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo Tests (cosmic)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontends/cosmic
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: install build dependencies
        run: |
          sudo apt-get update -qq
          # libxkbcommon-x11-dev is NOT redundant with libxkbcommon-dev:
          # winit's X11 backend dlopens libxkbcommon-x11.so at runtime and the
          # -dev package is what ships the unversioned symlink.
          sudo apt-get install -y -qq \
            pkg-config cmake clang \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev \
            libinput-dev libudev-dev libgbm-dev libegl1-mesa-dev libssl-dev

      - name: check out the installer daemon
        uses: actions/checkout@v7.0.1
        with:
          repository: tuna-os/fisherman
          ref: 2fc33965f294b4ceb3462c3b3877b1938ae77c5d
          path: fishermand-src
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: fishermand-src/fisherman/go.mod
          # No go.sum: the daemon is standard-library only.
          cache: false

      - name: build the mock daemon
        working-directory: fishermand-src/fisherman
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/fishermand" ./cmd/fishermand
          "$RUNNER_TEMP/fishermand" --list-scenarios
          echo "FISHERMAND_BIN=$RUNNER_TEMP/fishermand" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: frontends/cosmic

      - name: cargo test
        run: cargo test -- --nocapture

      # A skip is a pass for cargo. This step is what fails when the mock
      # was not there, so that a green job means the daemon path ran.
      - name: the daemon tests ran
        run: |
          test -x "$FISHERMAND_BIN"
          cargo test -- --nocapture flow_ mock_ 2>&1 | tee "$RUNNER_TEMP/daemon-tests.log"
          ! grep -q '^SKIPPED' "$RUNNER_TEMP/daemon-tests.log"
