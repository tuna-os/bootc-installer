name: KDE wasm build

# Compiles the KDE frontend for WebAssembly (Qt for WebAssembly, Emscripten).
# This is the first step of #104, rendering the KDE wizard in a browser: the
# C++ backend has to compile and link for wasm32-emscripten before anything
# can be bundled or driven. It is a build check only. Nothing is served or
# rendered yet, because the KF6 QML stack (Kirigami, Kirigami Addons) is not
# bundled. shared/browser/README.md records what is left.
#
# Qt 6.9 matches the org.kde.Platform 6.9 runtime in the Flatpak manifest, and
# Emscripten 3.1.70 is the version Qt 6.9 is built with. The multithread Qt is
# used because Kirigami needs QtConcurrent, which the single-thread wasm Qt
# does not ship.

on:
  push:
    branches: [dev]
    paths:
      - "frontends/kde/**"
      - ".github/workflows/wasm-kde.yml"
  pull_request:
    paths:
      - "frontends/kde/**"
      - ".github/workflows/wasm-kde.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-kde-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.9.3"
  EMSDK_VERSION: "3.1.70"

jobs:
  build:
    name: Build KDE frontend for wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Qt (host and wasm_multithread)
        run: |
          pip install aqtinstall ninja
          # A wasm Qt cross-compiles: moc, rcc and qmlimportscanner run from
          # the host Qt of the same version.
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$RUNNER_TEMP/qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_multithread -O "$RUNNER_TEMP/qt"

      - name: install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: build
        working-directory: frontends/kde
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          QT="$RUNNER_TEMP/qt/$QT_VERSION"
          "$QT/wasm_multithread/bin/qt-cmake" -G Ninja -S . -B build-wasm \
            -DQT_HOST_PATH="$QT/gcc_64" \
            -DBUILD_CAPTURE=ON -DBUILD_TESTING=ON
          cmake --build build-wasm
          ls -l build-wasm/*.wasm
