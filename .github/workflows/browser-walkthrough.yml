name: Browser walkthrough

# Renders the frontends in a real browser and walks every wizard page with
# Playwright. The GTK frontends arrive through GTK Broadway. Niri has no
# Broadway: its QML wizard is compiled to WebAssembly with Qt for WebAssembly
# (frontends/niri/tests/wasm) and served as a static page. See
# shared/browser/README.md, including what COSMIC and KDE still need.
#
# The niri entry is advisory (continue-on-error) until it has a run history.
#
# This does not replace the screenshots-*.yml jobs. Those capture the docs
# images in-process and can read the widget tree for text; this one proves the
# wizard still advances under a driver that can click it.

on:
  push:
    branches: [dev]
    paths:
      - "bootc_installer/**"
      - "frontends/xfce/**"
      - "frontends/niri/ui/**"
      - "frontends/niri/tests/qml-stubs/**"
      - "frontends/niri/tests/wasm/**"
      - "shared/progress/dry-run-transcript.ndjson"
      - "shared/browser/**"
      - ".github/workflows/browser-walkthrough.yml"
  pull_request:
    paths:
      - "bootc_installer/**"
      - "frontends/xfce/**"
      - "frontends/niri/ui/**"
      - "frontends/niri/tests/qml-stubs/**"
      - "frontends/niri/tests/wasm/**"
      - "shared/progress/dry-run-transcript.ndjson"
      - "shared/browser/**"
      - ".github/workflows/browser-walkthrough.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-walkthrough-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    name: Browser walkthrough (${{ matrix.frontend }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.frontend == 'niri' }}
    strategy:
      fail-fast: false
      matrix:
        frontend: [gnome, xfce, niri]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install GTK, Broadway daemons and introspection
        if: matrix.frontend != 'niri'
        run: |
          sudo apt-get update -qq
          # libgtk-4-bin ships gtk4-broadwayd and libgtk-3-bin ships
          # broadwayd; the backends themselves are compiled into libgdk, so
          # these two packages are the whole of what Broadway needs.
          #
          # The rest is the GNOME meson build, and is deliberately the same
          # set screenshots-gnome.yml installs. gettext is not optional:
          # data/meson.build calls i18n.merge_file for the .desktop and
          # appdata files, which needs msgfmt, and meson setup fails at
          # configure time without it.
          sudo apt-get install -y -qq \
            libgtk-4-bin libgtk-3-bin \
            gir1.2-gtk-4.0 gir1.2-gtk-3.0 gir1.2-adw-1 gir1.2-vte-3.91 \
            python3-gi python3-gi-cairo \
            meson ninja-build blueprint-compiler libglib2.0-dev \
            desktop-file-utils appstream gettext \
            adwaita-icon-theme

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install Playwright and its Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: build the GNOME GResource bundle
        if: matrix.frontend == 'gnome'
        run: |
          # The GTK templates are compiled from .blp into the bundle, and the
          # Python that binds their children is checked against it at runtime.
          # A stale bundle fails as a missing template child, so this is built
          # fresh rather than cached.
          meson setup build -Dbuild-fisherman=false --prefix=/tmp/install
          ninja -C build

      # Qt 6.9 and Emscripten 3.1.70 are the pair Qt 6.9 is built with, and
      # the same pair wasm-kde.yml uses. The single-thread Qt is enough here
      # and needs no cross-origin isolation headers from the static server.
      - uses: actions/setup-python@v5
        if: matrix.frontend == 'niri'
        with:
          python-version: "3.12"

      - name: install Qt for WebAssembly and Emscripten
        if: matrix.frontend == 'niri'
        env:
          QT_VERSION: "6.9.3"
          EMSDK_VERSION: "3.1.70"
        run: |
          pip install aqtinstall ninja
          # A wasm Qt cross-compiles: moc, rcc and qmlimportscanner run from
          # the host Qt of the same version.
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$RUNNER_TEMP/qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$RUNNER_TEMP/qt"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "QT=$RUNNER_TEMP/qt/$QT_VERSION" >> "$GITHUB_ENV"

      - name: build the Niri wizard for WebAssembly
        if: matrix.frontend == 'niri'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          "$QT/wasm_singlethread/bin/qt-cmake" -G Ninja \
            -S frontends/niri/tests/wasm -B build-wasm-niri \
            -DQT_HOST_PATH="$QT/gcc_64"
          cmake --build build-wasm-niri

      - name: walk ${{ matrix.frontend }} in a browser
        env:
          BOOTC_RESOURCE: build/bootc_installer/bootc-installer.gresource
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: shared/browser/run.sh "${{ matrix.frontend }}" "docs/browser/${{ matrix.frontend }}"

      - name: upload what the browser saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-walkthrough-${{ matrix.frontend }}
          path: docs/browser/${{ matrix.frontend }}
          if-no-files-found: warn
