name: Python Tests

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this PR only touches documentation — if so, skip tests
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check for non-docs changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Never skip on direct pushes to dev/prod or merge_group — only skip on PRs
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$changed"
          # If every changed file matches a docs pattern, skip tests
          if echo "$changed" | grep -qvE '^(README\.md|AGENTS\.md|CLAUDE\.md|MULTI_VARIANT_BUILD\.md|[^/]+\.md|docs/|\.github/[^/]+\.md)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  # The version of the shared contracts (#226). A change to a contract file
  # in shared/ needs a new shared/CHANGELOG.md entry and a greater
  # shared/VERSION than the base has. That needs history, so it is not in
  # the unit suite (which runs in shallow, fork and packaged checkouts):
  # this job checks out everything and compares with the PR base, the merge
  # queue base, or the commit before the push. It runs on every event,
  # docs-only changes included, and promote.yml reads it with the rest of
  # Python Tests.
  contracts:
    name: Shared contract version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check the version against the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$QUEUE_BASE" ;;
            push)
              # A new branch has no "before"; compare it with dev.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                base=origin/dev
              else
                base="$BEFORE"
              fi ;;
            *) base=origin/dev ;;
          esac
          python3 shared/ci/contract_version.py --check --base "$base"

  # ── Job 1: Pure-logic unit tests (no display, no GTK) ─────────────────────
  unit:
    name: Unit Tests (no display)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # segno draws the phone companion's QR code; the Flatpak ships the
      # same pinned version (flatpak/org.bootcinstaller.Installer.json).
      # PyYAML is for tests/unit/test_promote_gate.py, which reads the
      # workflow files.
      - name: Install pytest, coverage, segno and PyYAML
        run: pip install pytest pytest-cov segno==1.6.6 pyyaml==6.0.2

      # ruff.toml names the rules; the version is pinned so that a ruff
      # release cannot change the result (#321).
      - name: Lint with ruff
        run: |
          pip install ruff==0.17.2
          python3 -m ruff check bootc_installer/ tests/

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=bootc_installer --cov-report=xml --cov-report=term-missing --cov-fail-under=51


      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  unit-docs-skip:
    name: Unit Tests (no display)
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Documentation-only change — unit tests skipped ✓"

  # ── Job 2: GTK integration tests (offscreen backend + compiled resources) ──
  ui:
    name: UI Integration Tests (offscreen GTK)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pytest \
            python3-gi \
            python3-gi-cairo \
            python3-segno \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-vte-3.91 \
            blueprint-compiler \
            meson \
            ninja-build \
            libglib2.0-dev \
            desktop-file-utils \
            appstream \
            gettext \
            xvfb
          pip3 install pytest-cov 2>/dev/null || true

      - name: Build GResources (blueprints → .gresource)
        run: |
          meson setup build \
            -Dbuild-fisherman=false \
            --prefix=/tmp/tuna-install
          ninja -C build
          RESOURCE=$(find build -name "bootc-installer.gresource" | head -1)
          echo "TUNA_RESOURCE=${RESOURCE}" >> "$GITHUB_ENV"
          echo "GResource built at: ${RESOURCE}"

      # #311: the template had gone two years without the tree it describes.
      # This job has gettext and the ITS rules (appstream, libglib2.0-dev)
      # that the check needs to read the data files.
      - name: Check that po/POTFILES and the translation template are current
        run: python3 po/update-pot.py --check

      - name: Run UI integration tests (Xvfb)
        env:
          GTK_A11Y: none
          NO_AT_BRIDGE: "1"
        run: |
          xvfb-run -a python3 -m pytest tests/ui/ -v --tb=short \
            -p no:cacheprovider \
            --cov=bootc_installer --cov-report=xml --cov-report=term-missing --cov-fail-under=0

      - name: Upload UI coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ui
          path: coverage.xml
          retention-days: 30

  ui-docs-skip:
    name: UI Integration Tests (offscreen GTK)
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Documentation-only change — UI tests skipped ✓"
