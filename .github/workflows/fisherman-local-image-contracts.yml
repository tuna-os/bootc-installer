name: Local image installer contracts
on:
  pull_request:
    paths:
      - fisherman/fisherman/internal/install/**
      - fisherman/fisherman/cmd/fisherman/**
      - fisherman/tests/native-local-id.py
      - fisherman/tests/native-process.py
      - fisherman/tests/test-native-process.py
      - fisherman/tui/**
      - .github/workflows/fisherman-local-image-contracts.yml
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: fisherman

jobs:
  local-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: fisherman/tui/go.mod
          cache-dependency-path: fisherman/tui/go.sum
      - name: Exercise actual CLI and installer source routes
        working-directory: fisherman/fisherman
        run: go test ./internal/install ./cmd/fisherman
      - name: Build and test the inherited TUI module
        working-directory: fisherman/tui
        run: |
          go test -mod=readonly ./...
          go build -mod=readonly -o "$RUNNER_TEMP/fisherman-tui" ./cmd/bootc-installer-tui
      - name: Install native local-store tools without acquiring an OS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo
      - name: Verify owned native process deadlines and reap
        run: python3 tests/test-native-process.py -v
      - name: Observe real image-ID transport and compiled cache consumer
        run: sudo --preserve-env=PATH,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT python3 tests/native-local-id.py > "$RUNNER_TEMP/fisherman-local-id.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: fisherman-local-id-proof
          path: ${{ runner.temp }}/fisherman-local-id.json
          if-no-files-found: warn
          retention-days: 14
