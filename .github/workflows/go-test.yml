name: Go Tests

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: fisherman/fisherman

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: fisherman/fisherman/go.sum

      - name: go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          go test -v -count=1 -timeout=60s -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Check coverage threshold
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/total:/ {gsub("%",""); print $NF}')
          echo "Coverage: ${pct}%"
          if awk "BEGIN {exit !(${pct} < 20)}"; then
            echo "Coverage ${pct}% is below the 20% threshold"
            exit 1
          fi

      - name: Run tests with race detector
        run: go test -race -count=1 -timeout=60s ./...
