name: Validate Flatpak Manifests

on:
  pull_request:
    paths:
      - 'flatpak/*.json'
      - 'meson.build'
      - 'meson_options.txt'
      - 'bootc_installer/meson.build'
      - '.github/workflows/validate-flatpak.yml'
  push:
    branches: [dev, prod]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder jq
      - name: Validate Flatpak manifests
        run: |
          for manifest in flatpak/*installer*.json; do
            echo "Validating $manifest..."
            python3 -m json.tool "$manifest" > /dev/null
            app_id=$(jq -r '."app-id"' "$manifest")
            runtime=$(jq -r '.runtime' "$manifest")
            command=$(jq -r '.command' "$manifest")
            test -n "$app_id" && test "$app_id" != null
            test -n "$runtime" && test "$runtime" != null
            test -n "$command" && test "$command" != null
            echo "✓ $app_id"
          done
      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Flatpak manifest validation"
            echo "Validated the checked-in installer manifests without granting PR write permissions."
          } >> "$GITHUB_STEP_SUMMARY"
