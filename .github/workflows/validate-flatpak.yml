name: Validate Flatpak Manifests

on:
  pull_request:
    paths:
      - 'flatpak/*.json'
      - 'frontends/*/flatpak/*.json'
      - 'shared/flatpak/**'
      - 'shared/ci/flatpak_manifest.py'
      - 'meson.build'
      - 'meson_options.txt'
      - 'bootc_installer/meson.build'
      - '.github/workflows/validate-flatpak.yml'
  push:
    branches: [dev, prod]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # promote.yml requires this check by name (REQUIRED_CHECKS).
    name: Validate Flatpak manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Every manifest builds fisherman from the submodule.
          submodules: true
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder jq
      - name: Validate Flatpak manifests
        run: |
          for manifest in flatpak/*installer*.json; do
            echo "Validating $manifest..."
            python3 -m json.tool "$manifest" > /dev/null
            app_id=$(jq -r '."app-id"' "$manifest")
            runtime=$(jq -r '.runtime' "$manifest")
            command=$(jq -r '.command' "$manifest")
            test -n "$app_id" && test "$app_id" != null
            test -n "$runtime" && test "$runtime" != null
            test -n "$command" && test "$command" != null
            echo "✓ $app_id"
          done
      # A module named by path (shared/flatpak/go.json) and every local
      # source resolve against the file that names them. flatpak-builder
      # reads each manifest with its includes, and flatpak_manifest.py checks
      # that each module include, `dir` and `file` source exists there.
      - name: Resolve module includes and local sources
        run: |
          set -euo pipefail
          manifests=(flatpak/org.bootcinstaller.*.json frontends/*/flatpak/org.tunaos.Installer*.json)
          for manifest in "${manifests[@]}"; do
            flatpak-builder --show-manifest "$manifest" > /dev/null
            echo "✓ $manifest"
          done
          python3 shared/ci/flatpak_manifest.py "${manifests[@]}"
      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Flatpak manifest validation"
            echo "Validated the checked-in installer manifests without granting PR write permissions."
          } >> "$GITHUB_STEP_SUMMARY"
